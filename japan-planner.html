  {id:2,cat:"📄 Documents",item:"ANA booking ref: DAZ49R (printed)",done:false},
  {id:3,cat:"📄 Documents",item:"Travel insurance",done:false},
  {id:4,cat:"📄 Documents",item:"Hotel booking printouts",done:false},
  {id:5,cat:"📄 Documents",item:"International driving permit",done:false},
  {id:6,cat:"🔌 Electronics",item:"Power adapter (Type A — Japan)",done:false},
  {id:7,cat:"🔌 Electronics",item:"Portable charger",done:false},
  {id:8,cat:"🔌 Electronics",item:"Phone + charger",done:false},
  {id:9,cat:"🔌 Electronics",item:"Pocket WiFi / SIM card",done:false},
  {id:10,cat:"👕 Clothing",item:"Autumn layers (10–18°C)",done:false},
  {id:11,cat:"👕 Clothing",item:"Comfortable walking shoes (broken in!)",done:false},
  {id:12,cat:"👕 Clothing",item:"Light jacket / raincoat",done:false},
  {id:13,cat:"👕 Clothing",item:"Quick-dry clothes for water activities",done:false},
  {id:14,cat:"👕 Clothing",item:"Water shoes / sandals for rafting",done:false},
  {id:15,cat:"👕 Clothing",item:"Warm layer for Kochi mountains (night)",done:false},
  {id:16,cat:"💊 Health",item:"Personal medications",done:false},
  {id:17,cat:"💊 Health",item:"Motion sickness tabs (winding mountain roads)",done:false},
  {id:18,cat:"💊 Health",item:"Sunscreen & lip balm",done:false},
  {id:19,cat:"💰 Misc",item:"Japanese yen cash (¥50,000+ recommended)",done:false},
  {id:20,cat:"💰 Misc",item:"Suica IC card",done:false},
  {id:21,cat:"💰 Misc",item:"Small daypack / dry bag for water activities",done:false},
  {id:22,cat:"💰 Misc",item:"Waterproof phone case (rafting + canyoning)",done:false},
];

let currency = "SGD";
let tipFilter = "All";
let mapFilter = "All";
let codeFilter = "All";

// ── UTILITIES ────────────────────────────────────────────────
function cityClass(city){ return (city||"").toLowerCase(); }
function save(key,val){ try{localStorage.setItem(key,JSON.stringify(val));}catch(e){} }
function load(key){ try{const v=localStorage.getItem(key);return v?JSON.parse(v):null;}catch(e){return null;} }
function showStatus(id,msg){ const el=document.getElementById(id); if(el){el.textContent=msg;setTimeout(()=>el.textContent="",2500);} }

// ── TAB SWITCHING ─────────────────────────────────────────────
function switchTab(name){
  document.querySelectorAll('.content').forEach(c=>c.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  document.getElementById('tab-'+name).classList.add('active');
  event.target.classList.add('active');
  renderTab(name);
}
function renderTab(name){
  if(name==='flights') renderFlights();
  else if(name==='hotels') renderHotels();
  else if(name==='itinerary') renderItinerary();
  else if(name==='map') renderMap();
  else if(name==='codes') renderCodes();
  else if(name==='tips') renderTips();
  else if(name==='expenses') renderExpenses();
  else if(name==='packing') renderPacking();
}

// ── FLIGHTS ───────────────────────────────────────────────────
function renderFlights(){
  const el=document.getElementById('tab-flights');
  el.innerHTML=`<p style="font-size:11px;font-weight:700;color:#9ca3af;margin-bottom:8px">ANA Reservation · DAZ49R</p>`+
  FLIGHTS.map(f=>`
    <div class="flight-card">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
        <div><span class="flight-num">${f.flight}</span><span class="confirmed">Confirmed</span></div>
        <span style="font-size:11px;color:#9ca3af">${f.date}</span>
      </div>
      <div style="font-weight:600;font-size:13px;margin-bottom:6px">${f.route}</div>
      <div class="times">
        <div class="time-block"><div class="time-label">DEP</div><div class="time-val">${f.dep}</div></div>
        <div style="font-size:20px;color:#d1d5db;margin-top:12px">→</div>
        <div class="time-block"><div class="time-label">ARR</div><div class="time-val">${f.arr}</div></div>
      </div>
      <div class="note-box">${f.cls} · ${f.note}</div>
    </div>`).join('')+
  `<div class="warn">⚠️ <strong>Terminal reminder:</strong> Always check terminal assignments on your departure date — terminals can change.</div>`;
}

// ── HOTELS ───────────────────────────────────────────────────
function renderHotels(){
  const el=document.getElementById('tab-hotels');
  el.innerHTML=`<p style="font-size:11px;font-weight:700;color:#9ca3af;margin-bottom:8px">Tap to fill in details when booked</p>`+
  hotels.map(h=>`
    <div class="card ${cityClass(h.city)}">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:10px">
        <span class="badge ${cityClass(h.city)}">${h.city}</span>
        <span style="font-size:12px;color:#6b7280">${h.checkin} → ${h.checkout}</span>
      </div>
      <div class="hotel-input-group"><label>Hotel name</label>
        <input value="${h.name}" placeholder="Enter hotel name" oninput="updateHotel('${h.id}','name',this.value)"/></div>
      <div class="hotel-input-group"><label>Booking reference</label>
        <input value="${h.ref}" placeholder="Confirmation number" oninput="updateHotel('${h.id}','ref',this.value)"/></div>
      <div class="note-box">${h.note}</div>
    </div>`).join('')+
  `<div class="save-row">
    <button class="btn btn-red" style="flex:1" onclick="saveHotels()">💾 Save Hotels</button>
    <button class="btn btn-white" style="flex:1" onclick="loadHotels()">📂 Load Saved</button>
  </div>
  <div class="save-status" id="hotel-status"></div>`;
}
function updateHotel(id,field,val){ const h=hotels.find(h=>String(h.id)===String(id)); if(h) h[field]=val; }
function saveHotels(){ save('hotels',hotels); showStatus('hotel-status','✅ Saved!'); }
function loadHotels(){ const d=load('hotels'); if(d){hotels=d;renderHotels();showStatus('hotel-status','📂 Loaded!');} else showStatus('hotel-status','No saved data'); }

// ── ITINERARY ────────────────────────────────────────────────
function renderItinerary(){
  const el=document.getElementById('tab-itinerary');
  const d=days[selectedDay];
  const cc=cityClass(d.city);
  el.innerHTML=`
  <div class="itinerary-layout">
    <div class="day-list">${days.map((day,i)=>`
      <button class="day-btn ${i===selectedDay?'active '+cityClass(day.city):''}" onclick="selectDay(${i})">
        <div class="day-name">${day.dow}, ${day.date}</div>
        <div class="day-city">${day.city||'—'}</div>
      </button>`).join('')}
    </div>
    <div style="flex:1">
      <div class="detail-card ${cc}">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
          <div>
            <div style="font-weight:700;font-size:16px">${d.dow}, ${d.date}</div>
            <div style="font-size:12px;color:#6b7280">Day ${selectedDay+1} of 16</div>
          </div>
          <select onchange="updateDayCity(${selectedDay},this.value)" style="font-size:12px;font-weight:600;border-radius:8px;padding:4px 8px">
            <option value="">— No city —</option>
            ${['Osaka','Kobe','Kochi','Tokyo'].map(c=>`<option ${d.city===c?'selected':''}>${c}</option>`).join('')}
          </select>
        </div>
        <div class="section-label">Activities</div>
        <div id="activity-list">${d.activities.length===0?'<p style="font-size:11px;color:#9ca3af;font-style:italic">Nothing planned yet.</p>':
          d.activities.map((a,ai)=>`
          <div class="activity-row">
            <div class="move-btns">
              <button class="move-btn" onclick="moveAct(${ai},-1)" ${ai===0?'disabled':''}>▲</button>
              <button class="move-btn" onclick="moveAct(${ai},1)" ${ai===d.activities.length-1?'disabled':''}>▼</button>
            </div>
            <span style="flex:1">${a}</span>
            <button class="del-btn" onclick="removeAct(${ai})">✕</button>
          </div>`).join('')}
        </div>
        <div class="input-row">
          <input id="new-act" placeholder="Add an activity…" onkeydown="if(event.key==='Enter')addAct()"/>
          <button class="btn btn-red" style="flex-shrink:0" onclick="addAct()">+</button>
        </div>
        <div class="section-label" style="margin-top:12px">Notes</div>
        <textarea rows="3" placeholder="Hotel name, booking refs, transport tips…" oninput="updateDayNotes(${selectedDay},this.value)">${d.notes}</textarea>
        <div class="save-row">
          <button class="btn btn-red" style="flex:1" onclick="saveItinerary()">💾 Save Itinerary</button>
          <button class="btn btn-white" style="flex:1" onclick="loadItinerary()">📂 Load Saved</button>
        </div>
        <div class="save-status" id="itin-status"></div>
      </div>
    </div>
  </div>`;
}
function selectDay(i){ selectedDay=i; renderItinerary(); }
function updateDayCity(i,val){ days[i].city=val; renderItinerary(); }
function updateDayNotes(i,val){ days[i].notes=val; }
function addAct(){ const inp=document.getElementById('new-act'); const v=inp.value.trim(); if(!v)return; days[selectedDay].activities.push(v); inp.value=''; renderItinerary(); }
function removeAct(ai){ days[selectedDay].activities.splice(ai,1); renderItinerary(); }
function moveAct(ai,dir){ const acts=days[selectedDay].activities; const to=ai+dir; if(to<0||to>=acts.length)return; [acts[ai],acts[to]]=[acts[to],acts[ai]]; renderItinerary(); }
function saveItinerary(){ save('itinerary',days); showStatus('itin-status','✅ Saved!'); }
function loadItinerary(){ const d=load('itinerary'); if(d){days=d;renderItinerary();showStatus('itin-status','📂 Loaded!');} else showStatus('itin-status','No saved data'); }

// ── MAP ───────────────────────────────────────────────────────
function renderMap(){
  const filtered=mapFilter==='All'?MAP_LOCS:MAP_LOCS.filter(l=>l.city===mapFilter);
  document.getElementById('tab-map').innerHTML=`
    <div class="info">📍 Tap <strong>Open in Maps</strong> to view · <strong>Directions</strong> for turn-by-turn navigation.</div>
    <div class="filter-row">${['All','Osaka','Kobe','Kochi','Tokyo'].map(c=>`
      <button class="filter-btn ${mapFilter===c?'active':''}" onclick="setMapFilter('${c}')">${c}</button>`).join('')}
    </div>
    ${filtered.map(loc=>`
    <div class="card ${cityClass(loc.city)}">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:4px">
        <span class="badge ${cityClass(loc.city)}">${loc.city}</span>
        <span style="font-weight:700;font-size:13px">${loc.name}</span>
      </div>
      ${loc.note?`<div style="font-size:11px;color:#6b7280;margin-bottom:8px">💬 ${loc.note}</div>`:''}
      <div style="display:flex;gap:8px">
        <a href="https://www.google.com/maps/search/?api=1&query=${loc.lat},${loc.lng}" target="_blank" class="btn-sm btn-maps">🗺️ Open in Maps</a>
        <a href="https://www.google.com/maps/dir/?api=1&destination=${loc.lat},${loc.lng}" target="_blank" class="btn-sm btn-dir">🧭 Directions</a>
      </div>
    </div>`).join('')}`;
}
function setMapFilter(c){ mapFilter=c; renderMap(); }

// ── MAP CODES ─────────────────────────────────────────────────
function renderCodes(){
  const filtered=codeFilter==='All'?mapcodes:mapcodes.filter(m=>m.city===codeFilter);
  document.getElementById('tab-codes').innerHTML=`
    <div class="info">🗺️ Enter the map code into your car rental GPS or tap <strong>Search →</strong> to look up on <a href="https://japanmapcode.com/en" target="_blank" style="font-weight:700">japanmapcode.com</a></div>
    <div class="filter-row">${['All','Osaka','Kobe','Kochi','Tokyo'].map(c=>`
      <button class="filter-btn ${codeFilter===c?'active':''}" onclick="setCodeFilter('${c}')">${c}</button>`).join('')}
    </div>
    ${filtered.map(m=>`
    <div class="card ${cityClass(m.city)}">
      <div style="display:flex;justify-content:space-between;align-items:flex-start">
        <div style="flex:1">
          <div style="display:flex;align-items:center;gap:8px;margin-bottom:4px">
            <span class="badge ${cityClass(m.city)}">${m.city}</span>
            <span style="font-weight:700;font-size:13px">${m.name}</span>
          </div>
          <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:4px">
            <span class="mapcode-row">${m.code}</span>
            <button class="btn-sm btn-maps" onclick="navigator.clipboard.writeText('${m.code}')">Copy</button>
            <a href="https://japanmapcode.com/en#${m.code.replace(/\s/g,'')}" target="_blank" class="btn-sm btn-dir">Search →</a>
          </div>
          ${m.notes?`<div style="font-size:11px;color:#6b7280">💬 ${m.notes}</div>`:''}
        </div>
        <button onclick="removeCode(${m.id})" style="color:#f87171;background:none;border:none;cursor:pointer;font-size:13px;margin-left:8px">✕</button>
      </div>
    </div>`).join('')}
    <div class="card" style="margin-top:4px">
      <div class="section-label">Add a map code</div>
      <div style="display:flex;flex-direction:column;gap:8px">
        <input id="nc-name" placeholder="Place name"/>
        <input id="nc-code" placeholder="Map code (e.g. 123 456 789)" style="font-family:monospace"/>
        <select id="nc-city">${['Osaka','Kobe','Kochi','Tokyo'].map(c=>`<option>${c}</option>`).join('')}</select>
        <input id="nc-notes" placeholder="Notes (optional)"/>
        <button class="btn btn-red" onclick="addCode()">Add Map Code</button>
      </div>
    </div>`;
}
function setCodeFilter(c){ codeFilter=c; renderCodes(); }
function removeCode(id){ mapcodes=mapcodes.filter(m=>m.id!==id); renderCodes(); }
function addCode(){
  const name=document.getElementById('nc-name').value.trim();
  const code=document.getElementById('nc-code').value.trim();
  if(!name||!code)return;
  mapcodes.push({id:Date.now(),name,code,city:document.getElementById('nc-city').value,notes:document.getElementById('nc-notes').value});
  renderCodes();
}

// ── TIPS ─────────────────────────────────────────────────────
function renderTips(){
  const filtered=tipFilter==='All'?TIPS:TIPS.filter(t=>t.city===tipFilter);
  document.getElementById('tab-tips').innerHTML=`
    <div class="filter-row">${['All','General','Osaka','Kobe','Kochi','Tokyo'].map(c=>`
      <button class="filter-btn ${tipFilter===c?'active':''}" onclick="setTipFilter('${c}')">${c}</button>`).join('')}
    </div>
    ${filtered.map(t=>`
    <div class="card" style="display:flex;gap:12px">
      <span style="font-size:20px;flex-shrink:0">${t.icon}</span>
      <div>
        <div style="font-size:10px;font-weight:700;color:#9ca3af;margin-bottom:2px">${t.city}</div>
        <div style="font-size:13px">${t.tip}</div>
      </div>
    </div>`).join('')}`;
}
function setTipFilter(c){ tipFilter=c; renderTips(); }

// ── EXPENSES ─────────────────────────────────────────────────
function renderExpenses(){
  const est=budget.reduce((s,b)=>s+Number(b.est||0),0);
  const act=budget.reduce((s,b)=>s+Number(b.act||0),0);
  const rem=est-act;
  document.getElementById('tab-expenses').innerHTML=`
    <div class="summary-row">
      <div class="summary-card"><div class="s-label">Estimated</div><div class="s-val" style="color:#3b82f6">${currency} ${est.toLocaleString()}</div></div>
      <div class="summary-card"><div class="s-label">Spent</div><div class="s-val" style="color:${act>est?'#dc2626':'#16a34a'}">${currency} ${act.toLocaleString()}</div></div>
      <div class="summary-card"><div class="s-label">Remaining</div><div class="s-val" style="color:${rem<0?'#dc2626':'#111'}">${currency} ${rem.toLocaleString()}</div></div>
    </div>
    <div class="filter-row">${['SGD','JPY','USD'].map(c=>`
      <button class="filter-btn ${currency===c?'active':''}" onclick="setCurrency('${c}')">${c}</button>`).join('')}
    </div>
    <div class="budget-table">
      <div class="budget-header"><div>Item</div><div style="text-align:right">Est.</div><div style="text-align:right">Actual</div><div></div></div>
      ${budget.map(b=>`
      <div class="budget-row">
        <div><div style="font-size:10px;color:#9ca3af">${b.cat}</div><div style="font-size:11px;font-weight:500">${b.item}</div></div>
        <div><input type="number" value="${b.est}" oninput="updateBudget(${b.id},'est',this.value)"/></div>
        <div><input type="number" value="${b.act}" oninput="updateBudget(${b.id},'act',this.value)"/></div>
        <div style="text-align:center"><button onclick="removeBudget(${b.id})" style="color:#f87171;background:none;border:none;cursor:pointer">✕</button></div>
      </div>`).join('')}
    </div>
    <div class="card">
      <div class="section-label">Add expense</div>
      <div style="display:flex;flex-direction:column;gap:8px">
        <input id="b-item" placeholder="Item description"/>
        <input id="b-cat" placeholder="Category (e.g. 🍜 Food)"/>
        <div style="display:flex;gap:8px">
          <input id="b-est" type="number" placeholder="Estimated" style="flex:1"/>
          <input id="b-act" type="number" placeholder="Actual" style="flex:1"/>
        </div>
        <button class="btn btn-red" onclick="addBudget()">Add Item</button>
      </div>
    </div>`;
}
function setCurrency(c){ currency=c; renderExpenses(); }
function updateBudget(id,field,val){ const b=budget.find(b=>b.id===id); if(b) b[field]=Number(val)||0; renderExpenses(); }
function removeBudget(id){ budget=budget.filter(b=>b.id!==id); renderExpenses(); }
function addBudget(){
  const item=document.getElementById('b-item').value.trim();
  if(!item)return;
  budget.push({id:Date.now(),cat:document.getElementById('b-cat').value||'💰 Misc',item,est:Number(document.getElementById('b-est').value)||0,act:Number(document.getElementById('b-act').value)||0});
  renderExpenses();
}

// ── PACKING ───────────────────────────────────────────────────
function renderPacking(){
  const done=packing.filter(p=>p.done).length;
  const pct=packing.length?Math.round(done/packing.length*100):0;
  const cats=[...new Set(packing.map(p=>p.cat))];
  document.getElementById('tab-packing').innerHTML=`
    <div class="card">
      <div style="display:flex;justify-content:space-between;font-size:13px;font-weight:600;margin-bottom:6px">
        <span>Packing progress</span><span style="color:#dc2626">${done} / ${packing.length}</span>
      </div>
      <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
      ${done===packing.length&&packing.length>0?'<div style="text-align:center;color:#16a34a;font-weight:700;font-size:13px;margin-top:6px">✅ All packed! Enjoy Japan!</div>':''}
    </div>
    ${cats.map(cat=>`
    <div class="pack-group">
      <div class="pack-header">${cat}</div>
      ${packing.filter(p=>p.cat===cat).map(p=>`
      <div class="pack-row">
        <input type="checkbox" ${p.done?'checked':''} onchange="togglePack(${p.id})"/>
        <span class="pack-label ${p.done?'done':''}">${p.item}</span>
        <button onclick="removePack(${p.id})" style="color:#f87171;background:none;border:none;cursor:pointer;font-size:12px">✕</button>
      </div>`).join('')}
    </div>`).join('')}
    <div class="card" style="margin-top:4px">
      <div class="section-label">Add item</div>
      <div style="display:flex;flex-direction:column;gap:8px">
        <input id="p-item" placeholder="What to pack?" onkeydown="if(event.key==='Enter')addPack()"/>
        <input id="p-cat" placeholder="Category (e.g. 👕 Clothing)"/>
        <button class="btn btn-red" onclick="addPack()">Add Item</button>
      </div>
    </div>`;
}
function togglePack(id){ const p=packing.find(p=>p.id===id); if(p) p.done=!p.done; renderPacking(); }
function removePack(id){ packing=packing.filter(p=>p.id!==id); renderPacking(); }
function addPack(){
  const item=document.getElementById('p-item').value.trim();
  if(!item)return;
  packing.push({id:Date.now(),cat:document.getElementById('p-cat').value||'💰 Misc',item,done:false});
  renderPacking();
}

// ── INIT ──────────────────────────────────────────────────────
renderFlights();
</script>
</body>
</html>
